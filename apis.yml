name: Khazna
description: >-
  Khazna is Egypt's leading financial super app, a Cairo-based fintech building
  inclusive financial services for the country's underbanked payroll workers and
  their families. Through its consumer mobile app it offers earned-wage access and
  salary advances, bill and utility payments, savings, and everyday consumer
  lending, with the goal of extending affordable, digital financial services to
  people traditionally excluded from the formal banking system. Khazna is backed by
  Speedinvest and operates as a business-to-consumer application; it does not publish
  a public developer portal or open API surface. This profile was added to the API
  Evangelist network as a portfolio-lead stub and enriched with verified public
  identity and domain-security signals.
